<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>YOalphabet Clicker</title>
<style>
  :root { --bg:#f6f6f4; --card:#fff; --ink:#1a1a1a; --mute:#6b6b66; --line:#d9d9d4; --good:#1f9d55; --hot:#e8590c; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { min-height:100%; }
  body {
    margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;
    display:flex; flex-direction:column; align-items:center; gap:6px;
    padding:max(4px, env(safe-area-inset-top)) 14px max(6px, env(safe-area-inset-bottom));
    user-select:none; -webkit-user-select:none; touch-action:manipulation;
  }
  .top { width:min(92vw,420px); display:flex; justify-content:center; align-items:center; gap:10px; min-height:56px; position:relative; }
  .cat { position:absolute; left:calc(50% + 44px); top:50%; width:56px; height:56px; transform:translateY(-50%);
    mix-blend-mode:multiply; pointer-events:none; opacity:0; }
  .cat.rare { width:68px; height:68px; filter:drop-shadow(0 0 6px rgba(255,190,40,.9)); }
  .cat.show { animation:catin .5s cubic-bezier(.2,1.5,.4,1) forwards; }
  @keyframes catin { 0% { opacity:0; transform:translateY(-50%) scale(.3) rotate(-14deg); } 100% { opacity:1; transform:translateY(-50%) scale(1) rotate(0); } }
  .top .num { font:800 38px/1 ui-monospace,Menlo,Consolas,monospace; color:var(--ink); }

  .stage {
    position:relative; width:min(86vw,38vh,360px); aspect-ratio:1;
    background:var(--card); border:1px solid var(--line); border-radius:28px; cursor:pointer;
  }
  .stage canvas { width:100%; height:100%; display:block; border-radius:28px; }
  .stage.pop canvas { animation:pop .16s; }
  .stage.win { animation:win .7s; border-color:var(--good); }
  @keyframes pop { 50% { transform:scale(.965); } }
  @keyframes win { 0% { box-shadow:0 0 0 0 rgba(31,157,85,.55); } 100% { box-shadow:0 0 0 30px rgba(31,157,85,0); } }
  .plus {
    position:absolute; left:50%; top:42%; transform:translate(-50%,0); pointer-events:none;
    font:800 40px system-ui,sans-serif; color:var(--good); animation:rise .9s forwards;
  }
  @keyframes rise { to { transform:translate(-50%,-70px); opacity:0; } }

  .matrix { display:grid; grid-template-columns:repeat(4,72px); gap:6px; margin-top:0; }
  .cell {
    position:relative; width:72px; height:72px; padding:0; cursor:pointer;
    background:var(--card); border:1px solid var(--line); border-radius:14px;
  }
  .cell canvas { width:100%; height:100%; display:block; }
  .cell.off canvas { opacity:.25; }
  .cell.target { border-color:var(--hot); box-shadow:0 0 0 2px var(--hot); }
  .cell.flash { background:#e7f6ec; border-color:var(--good); }
  .cell .l { position:absolute; left:5px; top:2px; font:600 10px ui-monospace,Menlo,Consolas,monospace; color:var(--mute); }
  .cell .n { position:absolute; right:5px; bottom:2px; font:600 9px ui-monospace,Menlo,Consolas,monospace; color:var(--mute); }
  .cell.target.vowel { background:#fce8e8; border-color:#d96b9a; box-shadow:0 0 0 2px #d96b9a; }
  .cell.target.cons { background:#e0f2fc; border-color:#2563a0; box-shadow:0 0 0 2px #2563a0; }

  .bar { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; align-items:center; }
  button.btn {
    font:inherit; font-weight:600; cursor:pointer; padding:6px 12px; border-radius:10px;
    background:#fff; color:var(--ink); border:1px solid var(--ink);
  }
  a.x {
    display:inline-flex; align-items:center; gap:10px; padding:8px 20px; border-radius:999px;
    background:var(--ink); color:#fff; text-decoration:none; font-weight:700; font-size:15px; letter-spacing:.3px;
    box-shadow:0 4px 14px rgba(0,0,0,.18); transition:transform .12s, box-shadow .12s;
  }
  a.x:active { transform:scale(.97); box-shadow:0 2px 8px rgba(0,0,0,.18); }
  a.x svg { width:16px; height:16px; fill:#fff; }
</style>
</head>
<body>

  var lastCat = -1, catEl = $('cat');
  function showCat(){
    var rare = Math.random() < 0.25, arr = rare ? RARE : CATS, k;
    do { k = rnd(arr.length); } while (!rare && k === lastCat);
    if (!rare) lastCat = k;
    catEl.src = arr[k];
    catEl.classList.toggle('rare', rare);
    catEl.classList.remove('show'); void catEl.offsetWidth; catEl.classList.add('show');
    return rare;
  }
  function isVowel(idx){ return [0,1,2,4,8].indexOf(idx) >= 0; }
  function toGlyphs(n){
    var g = [];
    while (n > 0) {
      g.unshift(n % 16);
      n = Math.floor(n / 16);
    }
    return g.length > 0 ? g : [0];
  }

  function newRound(prev, keepBits){
    do { target = rnd(16); } while (target === prev);
    if (!keepBits) {
      do { bits = rnd(16); } while (bits === target);
    }
    won = false; locked = false;
  }

  // ---- Big glyph ----
  var big = $('big'), bctx = big.getContext('2d'), stage = $('stage');
  function sizeBig(){
    var dpr = window.devicePixelRatio || 1, w = Math.round(big.clientWidth * dpr);
    if (w > 0 && big.width !== w) { big.width = w; big.height = w; }
  }
  function drawBig(){
    sizeBig();
    var W = big.width; bctx.clearRect(0, 0, W, W);
    var m = W * 0.18;
    glyph(bctx, m, m, W - 2*m, bits, { sw: W * 0.15, fg: won ? '#1f9d55' : '#111', ghost: '#e6e6e0' });
  }

  // ---- Mini matrix 4x4 ----
  var cells = [];
  (function buildMatrix(){
    var host = $('matrix');
    for (var i = 0; i < 16; i++) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'cell off'; b.title = '[' + IPA[i] + '] ' + i;
      var cv = document.createElement('canvas'); cv.width = 144; cv.height = 144;
      var l = document.createElement('span'); l.className = 'l'; l.textContent = IPA[i];
      var n = document.createElement('span'); n.className = 'n'; n.textContent = i;
      b.appendChild(cv); b.appendChild(l); b.appendChild(n);
      glyph(cv.getContext('2d'), 30, 30, 84, i, { sw: 18, fg: '#111' });
      (function(k){ b.addEventListener('click', function(){ speak(k); }); })(i);
      host.appendChild(b);
      cells.push({ el: b, n: n });
    }
  })();
  function updateCells(){
    for (var i = 0; i < 16; i++) {
      var c = st.counts[i];
      cells[i].el.classList.toggle('off', c === 0);
      cells[i].el.classList.toggle('target', i === target);
      cells[i].el.classList.toggle('vowel', i === target && isVowel(i));
      cells[i].el.classList.toggle('cons', i === target && !isVowel(i));
    }
    $('total').textContent = total();
  }

  function updateUI(){
    updateCells(); drawBig();
  }

  // ---- Sound: simple formant synth, letter names from YOconlang (ti no la ve bu so ha pe mi ku ja) ----
  var AC = null, master = null, noiseBuf = null;
  function audio(){
    if (!AC) {
      var C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      AC = new C();
      master = AC.createGain(); master.gain.value = 0.55; master.connect(AC.destination);
      var n = AC.sampleRate; noiseBuf = AC.createBuffer(1, n, n);
      var d = noiseBuf.getChannelData(0);
      for (var i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    }
    if (AC.state === 'suspended') AC.resume();
    return AC;
  }
  function voiced(F, t, d, vol, f0){
    var o = AC.createOscillator(); o.type = 'sawtooth'; o.frequency.setValueAtTime(f0 || 125, t);
    var g = AC.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.012);
    g.gain.setValueAtTime(vol, t + Math.max(0.012, d - 0.07));
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    var amp = [1, 0.7, 0.35];
    F.forEach(function(f, i){
      var b = AC.createBiquadFilter(); b.type = 'bandpass'; b.frequency.value = f; b.Q.value = i === 0 ? 6 : 9;
      var k = AC.createGain(); k.gain.value = amp[i] || 0.3;
      o.connect(b); b.connect(k); k.connect(g);
    });
    g.connect(master); o.start(t); o.stop(t + d + 0.05);
  }
  function noise(t, d, type, f, q, vol){
    var s = AC.createBufferSource(); s.buffer = noiseBuf;
    var b = AC.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q || 1;
    var g = AC.createGain();
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    s.connect(b); b.connect(g); g.connect(master); s.start(t, Math.random() * 0.5); s.stop(t + d + 0.02);
  }
  var VOW = { o:[500,900,2400], a:[800,1300,2500], e:[450,2000,2700], u:[320,800,2300], i:[300,2300,3000] };
  function speak(idx){
    if (!st.sound || !audio()) return;
    var ch = IPA[idx], t = AC.currentTime + 0.01;
    if (isVowel(idx)) {
      var f0 = 122 + Math.random() * 8;
      if (VOW[ch]) { voiced(VOW[ch], t, 0.42, 0.9, f0); return; }
    } else {
      noise(t, 0.08, 'highpass', 3000, 0.5, 0.4);
    }
  }
  function jingle(){
    if (!st.sound || !audio()) return;
    var t = AC.currentTime + 0.02;
    [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach(function(f, i){
      var o = AC.createOscillator(); o.type = 'triangle'; o.frequency.value = f;
      var g = AC.createGain(), s = t + i * 0.085, d = i === 4 ? 0.55 : 0.16;
      g.gain.setValueAtTime(0.0001, s);
      g.gain.linearRampToValueAtTime(0.35, s + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, s + d);
      o.connect(g); g.connect(master); o.start(s); o.stop(s + d + 0.02);
    });
  }

  function rareJingle(){
    if (!st.sound || !audio()) return;
    var t = AC.currentTime + 0.02;
    [523.25, 783.99, 1046.5, 1568, 2093, 1568, 2093, 3135.9].forEach(function(f, i){
      var o = AC.createOscillator(); o.type = i % 2 ? 'sine' : 'square'; o.frequency.value = f;
      var g = AC.createGain(), s = t + i * 0.06, d = i === 7 ? 0.8 : 0.14;
      g.gain.setValueAtTime(0.0001, s);
      g.gain.linearRampToValueAtTime(o.type === 'square' ? 0.12 : 0.3, s + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, s + d);
      o.connect(g); g.connect(master); o.start(s); o.stop(s + d + 0.02);
    });
  }

  // ---- Interaction ----
  function celebrate(){
    won = true; locked = true;
    st.counts[target]++; save(); var rare = showCat();
    stage.classList.remove('win'); void stage.offsetWidth; stage.classList.add('win');
    var p = document.createElement('div'); p.className = 'plus'; p.textContent = '+1'; stage.appendChild(p);
    setTimeout(function(){ if (p.parentNode) p.parentNode.removeChild(p); }, 1000);
    cells[target].el.classList.add('flash');
    var tk = target;
    setTimeout(function(){ cells[tk].el.classList.remove('flash'); }, 700);
    setTimeout(rare ? rareJingle : jingle, 260);
    if (navigator.vibrate) { try { navigator.vibrate(30); } catch (e) {} }
    updateUI();
    setTimeout(function(){ stage.classList.remove('win'); newRound(bits, true); updateUI(); }, 1000);
  }

  stage.addEventListener('pointerdown', function(e){
    if (locked) return;
    e.preventDefault();
    var r = stage.getBoundingClientRect();
    var dx = (e.clientX - r.left) / r.width - 0.5, dy = (e.clientY - r.top) / r.height - 0.5;
    var mask = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 4) : (dy > 0 ? 2 : 8);
    bits ^= mask;
    stage.classList.remove('pop'); void stage.offsetWidth; stage.classList.add('pop');
    speak(bits);
    if (bits === target) celebrate(); else updateUI();
  });

  $('snd').addEventListener('click', function(){
    st.sound = !st.sound; save();
    $('snd').textContent = 'Sound: ' + (st.sound ? 'on' : 'off');
  });
  var rstTimer = null;
  $('rst').addEventListener('click', function(){
    var b = $('rst');
    if (!rstTimer) {
      b.textContent = 'Tap again to reset';
      rstTimer = setTimeout(function(){ rstTimer = null; b.textContent = 'Reset counters'; }, 3000);
      return;
    }
    clearTimeout(rstTimer); rstTimer = null; b.textContent = 'Reset counters';
    for (var i = 0; i < 16; i++) st.counts[i] = 0;
    catEl.classList.remove('show'); lastCat = -1;
    save(); updateUI();
  });

  window.addEventListener('resize', drawBig);
  $('snd').textContent = 'Sound: ' + (st.sound ? 'on' : 'off');
  newRound(-1);
  updateUI();
})();
</script>
